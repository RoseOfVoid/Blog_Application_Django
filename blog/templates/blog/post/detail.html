{%  extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <img src="{{ post.cover_img }}" alt="{{ post.img_description }}">
    <p class="date">
        Published: {{ post.publish }} by {{ post.author }}
    </p>
    {{ post.body|linebreaks }}
    
    <a href="{% url 'blog:list' %}">All Posts</a>
{%  endblock %}
